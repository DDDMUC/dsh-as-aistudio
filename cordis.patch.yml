# dsh-as-aistudio bundle patch: the AI Studio composition, ONE row.
#
# Self-contained: the plugin list shows exactly this row. The four components are
# ordinary npm dependencies of this package (see package.json), not profile
# bundles, so they have no rows of their own and never appear in that list.
#
# The node half mounts each component HOST half (its loopback routes and its
# rollback / replay services) by importing the installed package, so host logic
# stays in the components and there is only one copy of it. The browser bundles
# travel inside this package (src/client.js) because a browser bundle is served
# per Loader row and the components have none.
#
# A component that is not installed is reported by /api/dsh-as-aistudio/status and
# is never mounted - the studio boots either way. Each component still has its own
# cordis.patch.yml, so installing one standalone mounts it through its own row.
#
# The entry name is the BARE package name on purpose: the client-module scanner
# treats it as a package specifier and resolves <name>/package.json for the
# dsh.client declaration, so a subpath entry would be cached as "not a client
# package" and the browser half would silently never load.
- insert:
    - id: dsh-as-aistudio
      name: 'dsh-as-aistudio'
